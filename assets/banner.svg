<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Rudy NetProof</title><desc id="desc">Offline first-match network policy reasoning. IPv4 and IPv6 regions, shadowing, and decision counterexamples. C++20 developer preview.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#243448" stroke-width="1"/></pattern></defs>
  <rect width="1400" height="420" rx="22" fill="#0a1018"/><rect x="5" y="20" width="6" height="380" fill="#55e0b6"/>
  <rect x="860" y="20" width="510" height="280" fill="url(#grid)" opacity=".5"/>
  <text x="55" y="69" fill="#55e0b6" font-family="monospace" font-size="18" letter-spacing="3">RUDY SYSTEMS / NETWORK POLICY REASONING</text>
  <text x="53" y="158" fill="#edf4fc" font-family="Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-3">Rudy NetProof</text>
  <text x="56" y="218" fill="#97acc1" font-family="Arial,sans-serif" font-size="28">Every policy change has a witness.</text>
  <text x="56" y="264" fill="#97acc1" font-family="Arial,sans-serif" font-size="22">First-match rules. Exact regions. Explainable decisions.</text>
  <g fill="#101b28" stroke="#2e465a"><rect x="970" y="90" width="310" height="50" rx="6"/><rect x="995" y="156" width="310" height="50" rx="6"/><rect x="1020" y="222" width="310" height="50" rx="6"/></g>
  <g fill="#55e0b6" font-family="monospace" font-size="15"><text x="991" y="121">IPV4 + IPV6 / SYMBOLIC SPACE</text><text x="1016" y="187">SHADOWS + DECISION CHANGES</text><text x="1041" y="253">REPLAYABLE COUNTEREXAMPLES</text></g>
  <path d="M55 322H1340" stroke="#243448"/>
  <text x="56" y="373" fill="#55e0b6" font-family="monospace" font-size="19">C++20 / OFFLINE / TCP + UDP</text>
  <text x="1340" y="373" text-anchor="end" fill="#97acc1" font-family="monospace" font-size="17">DEVELOPER PREVIEW</text>
</svg>
